<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>电脑网盘</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20width='24'%20height='24'%20rx='5'%20fill='%232563eb'/%3E%3Cpath%20d='M18%2010h-1.26A8%208%200%201%200%209%2020h9a5%205%200%200%200%200-10z'%20fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/bootstrap.min.css">
<link rel="stylesheet" href="static/highlight.min.css">
<style>
  /* ========== 品牌色变量层 ==========
     克制基调：#2563eb 品牌蓝（primary）+ #f3f4f6 灰（页面底），与收藏面板头部观感一致。
     组件颜色一律由 --brand-* 派生为 Bootstrap 语义变量（--bs-*），
     按钮 / badge / progress / text-muted / 边框因此整体统一；
     浅色 / 深色模式只翻变量层，组件样式零改动。 */
  :root {
    /* 品牌基础色（primary/success/info/warning/danger + subtle/emphasis 变体） */
    --brand-primary: #2563eb;
    --brand-primary-rgb: 37, 99, 235;
    --brand-primary-subtle: #dbeafe;
    --brand-primary-emphasis: #1d4ed8;
    --brand-success: #16a34a;
    --brand-success-rgb: 22, 163, 74;
    --brand-success-subtle: #dcfce7;
    --brand-success-emphasis: #15803d;
    --brand-info: #0891b2;
    --brand-info-rgb: 8, 145, 178;
    --brand-info-subtle: #cffafe;
    --brand-info-emphasis: #155e75;
    --brand-warning: #d97706;
    --brand-warning-rgb: 217, 119, 6;
    --brand-warning-subtle: #fef3c7;
    --brand-warning-emphasis: #b45309;
    --brand-danger: #dc2626;
    --brand-danger-rgb: 220, 38, 38;
    --brand-danger-subtle: #fee2e2;
    --brand-danger-emphasis: #b91c1c;
    /* 中性面：页面底 / 面板面 / 边框 / 正文 / 弱化文字 */
    --brand-bg: #f3f4f6;
    --brand-surface: #ffffff;
    --brand-border: #d1d5db;
    --brand-text: #111827;
    --brand-text-muted: #6b7280;
    /* Bootstrap 语义映射 */
    --bs-primary: var(--brand-primary);
    --bs-primary-rgb: var(--brand-primary-rgb);
    --bs-primary-bg-subtle: var(--brand-primary-subtle);
    --bs-primary-border-subtle: #93c5fd;
    --bs-primary-text-emphasis: var(--brand-primary-emphasis);
    --bs-success: var(--brand-success);
    --bs-success-rgb: var(--brand-success-rgb);
    --bs-success-bg-subtle: var(--brand-success-subtle);
    --bs-success-border-subtle: #86efac;
    --bs-success-text-emphasis: var(--brand-success-emphasis);
    --bs-info: var(--brand-info);
    --bs-info-rgb: var(--brand-info-rgb);
    --bs-info-bg-subtle: var(--brand-info-subtle);
    --bs-info-border-subtle: #67e8f9;
    --bs-info-text-emphasis: var(--brand-info-emphasis);
    --bs-warning: var(--brand-warning);
    --bs-warning-rgb: var(--brand-warning-rgb);
    --bs-warning-bg-subtle: var(--brand-warning-subtle);
    --bs-warning-border-subtle: #fcd34d;
    --bs-warning-text-emphasis: var(--brand-warning-emphasis);
    --bs-danger: var(--brand-danger);
    --bs-danger-rgb: var(--brand-danger-rgb);
    --bs-danger-bg-subtle: var(--brand-danger-subtle);
    --bs-danger-border-subtle: #fecaca;
    --bs-danger-text-emphasis: var(--brand-danger-emphasis);
    --bs-body-bg: var(--brand-surface);        /* card/modal/list-group 的默认底色 */
    --bs-body-color: var(--brand-text);
    --bs-body-font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    --bs-secondary-color: var(--brand-text-muted);   /* text-muted / 次要文字 */
    --bs-secondary-bg: #e5e7eb;
    --bs-tertiary-bg: #e9edf2;                /* hover/内嵌面（略深于页面底，保证 hover 可见） */
    --bs-border-color: var(--brand-border);
    --bs-secondary-border-subtle: #d1d5db;
    --bs-link-color: var(--brand-primary);
    --bs-link-hover-color: var(--brand-primary-emphasis);
    --bs-progress-bg: #e5e7eb;
    --bs-progress-bar-bg: var(--bs-primary);  /* 进度条从默认蓝统一到品牌蓝 */
  }

  /* 深色模式：prefers-color-scheme 整层翻转（组件全部走 --bs-*，无需单独适配） */
  @media (prefers-color-scheme: dark) {
    :root {
      --brand-primary: #93c5fd;               /* 深底上提亮（柔和浅蓝更深底可读） */
      --brand-primary-rgb: 147, 197, 253;
      --brand-primary-subtle: #1e3a8a;
      --brand-primary-emphasis: #93c5fd;
      --brand-success: #22c55e;
      --brand-success-rgb: 34, 197, 94;
      --brand-success-subtle: #14532d;
      --brand-success-emphasis: #86efac;
      --brand-info: #06b6d4;
      --brand-info-rgb: 6, 182, 212;
      --brand-info-subtle: #164e63;
      --brand-info-emphasis: #67e8f9;
      --brand-warning: #f59e0b;
      --brand-warning-rgb: 245, 158, 11;
      --brand-warning-subtle: #78350f;
      --brand-warning-emphasis: #fcd34d;
      --brand-danger: #ef4444;
      --brand-danger-rgb: 239, 68, 68;
      --brand-danger-subtle: #7f1d1d;
      --brand-danger-emphasis: #fca5a5;
      --brand-bg: #0f172a;                    /* 页面底（slate-900） */
      --brand-surface: #1e293b;               /* 面板面（slate-800） */
      --brand-border: #334155;
      --brand-text: #f1f5f9;
      --brand-text-muted: #94a3b8;
      --bs-primary-border-subtle: #3b82f6;
      --bs-success-border-subtle: #22c55e;
      --bs-info-border-subtle: #06b6d4;
      --bs-warning-border-subtle: #f59e0b;
      --bs-danger-border-subtle: #ef4444;
      --bs-secondary-bg: #293548;
      --bs-tertiary-bg: #334155;   /* 深色下 hover/内嵌面需明显浅于面板底 #1e293b，否则列表 hover 与代码块背景不可见 */
      --bs-secondary-border-subtle: #475569;
      --bs-link-hover-color: var(--brand-primary-emphasis);
      --bs-progress-bg: #293548;
    }
    /* Bootstrap 工具类/组件里硬编码的浅色，深色下翻转到面板面 */
    .bg-white { background-color: var(--brand-surface) !important; }   /* navbar / card-header */
    .btn-close { filter: invert(1) grayscale(100%) brightness(200%); } /* 深色下关闭按钮转白 */
    /* highlight.js（GitHub 浅色主题）token 翻转：代码块在深底上保持可读 */
    .hljs { background: transparent; color: #d1d5db; }
    .hljs-doctag, .hljs-keyword, .hljs-meta .hljs-keyword, .hljs-template-tag,
    .hljs-template-variable, .hljs-type, .hljs-variable.language_ { color: #f472b6; }
    .hljs-title, .hljs-title.class_, .hljs-title.class_.inherited__, .hljs-title.function_ { color: #c4b5fd; }
    .hljs-attr, .hljs-attribute, .hljs-literal, .hljs-meta, .hljs-number, .hljs-operator,
    .hljs-selector-attr, .hljs-selector-class, .hljs-selector-id, .hljs-variable,
    .hljs-section { color: #93c5fd; }
    .hljs-meta .hljs-string, .hljs-regexp, .hljs-string { color: #86efac; }
    .hljs-built_in, .hljs-symbol { color: #fdba74; }
    .hljs-code, .hljs-comment, .hljs-formula { color: #6b7280; }
    .hljs-name, .hljs-quote, .hljs-selector-pseudo, .hljs-selector-tag { color: #86efac; }
    .hljs-subst, .hljs-emphasis, .hljs-strong { color: #d1d5db; }
    .hljs-bullet { color: #fde68a; }
    .hljs-addition { color: #86efac; background-color: rgba(34,197,94,.15); }
    .hljs-deletion { color: #fca5a5; background-color: rgba(239,68,68,.15); }
  }

  body {
    font-size: 14.5px; line-height: 1.6; background: var(--brand-bg);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    padding-top: calc(58px + env(safe-area-inset-top)); /* 固定顶栏高度 + 顶部安全区（刘海屏/横屏） */
    touch-action: manipulation; /* 手机端禁用双击缩放残留，点击更跟手 */
    -webkit-tap-highlight-color: rgba(37, 99, 235, .12);
    overscroll-behavior-y: contain; /* 文件列表顶部继续下拉不触发整页刷新（横向滚动手势不受影响） */
  }
  /* 顶部安全区：navbar 内容避开刘海/状态栏；py-1 工具类带 !important，须同权重覆盖 */
  .navbar { padding-top: calc(.25rem + env(safe-area-inset-top)) !important; }
  /* 横屏刘海机：navbar 左右也避开安全区（px-2 工具类带 !important，同权重覆盖） */
  .navbar .container-fluid {
    padding-left: calc(.5rem + env(safe-area-inset-left)) !important;
    padding-right: calc(.5rem + env(safe-area-inset-right)) !important;
  }
  /* 页面底固定为品牌灰（覆盖 Bootstrap .bg-body-tertiary 工具类的 !important） */
  body.bg-body-tertiary { background-color: var(--brand-bg) !important; }
  /* 键盘焦点统一高亮（:focus-visible 仅键盘导航时出现，鼠标点击不显示） */
  :focus-visible { outline: 2px solid var(--bs-primary); outline-offset: 2px; }
  /* 列表行 hover 反馈（桌面光标；触屏走点按反馈，无 sticky hover） */
  .list-group-item { transition: background-color .15s ease, color .15s ease;
                     border-bottom: 1px solid var(--bs-border-color); }   /* 行间细分隔，轮廓清晰 */
  #fileRows .list-group-item:last-child { border-bottom: none; }
  @media (hover: hover) {
    .list-group-item:hover { background: var(--bs-tertiary-bg); }
  }
  html { -webkit-text-size-adjust: 100%; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--bs-primary);
          color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
  /* 磁盘胶囊标签 / 面包屑：横向滚动，隐藏滚动条（惯性滚动 + 防翻页手势串扰） */
  #driveTabs, #breadcrumb { scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
  #driveTabs::-webkit-scrollbar, #breadcrumb::-webkit-scrollbar { display: none; }
  #driveTabs .btn { white-space: nowrap; }
  /* 面包屑分段 */
  #breadcrumb .seg { padding: 3px 8px; border-radius: 6px; cursor: pointer; color: var(--bs-secondary-color); white-space: nowrap; }
  @media (hover: hover) { #breadcrumb .seg:hover { background: var(--bs-tertiary-bg); color: var(--bs-body-color); } }
  #breadcrumb .sep { color: var(--bs-border-color); margin: 0 1px; }
  #breadcrumb .cur { color: var(--bs-body-color); font-weight: 600; padding: 3px 8px; white-space: nowrap; }
  /* T38 P3-2：盘符段加色（Windows 路径风格；.cur 已在 7) 加深为 primary） */
  #breadcrumb .seg.drive { color: var(--bs-primary); font-weight: 600; }
  /* T31 前进/后退：柔和圆润图标按钮（Material 风格，约 34px；浅蓝主题） */
  .nav-icon-btn {
    width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 50%;
    background: transparent; color: var(--bs-secondary-color);
    cursor: pointer; padding: 0; flex-shrink: 0;
    transition: background-color .18s ease, color .18s ease, transform .12s ease;
  }
  @media (hover: hover) {
    .nav-icon-btn:hover:not(:disabled) { background: var(--bs-primary-bg-subtle); color: var(--bs-primary); }
    .nav-icon-btn:active:not(:disabled) { transform: scale(.92); }
  }
  .nav-icon-btn:focus-visible { outline: 2px solid var(--bs-primary); outline-offset: 2px; }
  .nav-icon-btn:disabled { color: var(--bs-secondary-color); opacity: .38; cursor: default; }
  /* 移动端：触控目标 ≥44px（与同排刷新/筛选按钮对齐） */
  @media (max-width: 575.98px) {
    .nav-icon-btn { width: 44px; height: 44px; }
  }
  /* 置顶卡头部：标题可截断，按钮不挤压（修复窄屏 58px 横向溢出根因）；
     圆角让键盘焦点环（:focus-visible）更美观 */
  #pinnedHead { flex-shrink: 1; min-width: 0; border-radius: 6px; }
  #pinnedHeadTitle { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 文件名（flex 子项需要 min-width:0 才能正确截断） */
  .nm { min-width: 0; }
  /* 通用弹窗内备注行（原先 mdl-note 无任何样式，裸奔） */
  .mdl-note { font-size: 13px; color: var(--bs-secondary-color); margin-bottom: 8px; word-break: break-all; }
  /* Markdown 表格窄屏横向滚动（表格自身不可压缩，块级化后可滚动） */
  .md-table { display: block; overflow-x: auto; }
  /* 顶部轻量 toast（固定定位，避开 Bootstrap 自带 .toast 组件） */
  .app-toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 1080;
               background: rgba(17,24,39,.92); color: #fff; border-radius: 8px; padding: 9px 16px;
               font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw;
               box-shadow: 0 4px 14px rgba(17,24,39,.18); }
  .app-toast.show { opacity: 1; }
  .empty { text-align: center; color: var(--bs-secondary-color); padding: 40px 0; }
  /* T24 无权限目录：不可访问视觉（灰化图标 + 弱化文字 + 禁入光标 + 虚线边框） */
  .list-group-item.denied .ic img, .list-group-item.denied .ic svg,
  .grid-item.denied .grid-cover, .grid-item.denied .grid-cover.ic-inline { filter: grayscale(1) opacity(.55); }
  .list-group-item.denied .nm, .grid-item.denied .grid-name { color: var(--bs-secondary-color); }
  .grid-item.denied { border-style: dashed; }
  .list-group-item.denied, .grid-item.denied { cursor: not-allowed; }
  /* denied 目录图标右上角小锁（更直观的无权限标记） */
  .ic-wrap { position: relative; display: inline-flex; }
  .deny-lock {
    position: absolute; right: -7px; top: -5px;
    background: var(--brand-surface); border-radius: 50%;
    color: var(--bs-secondary-color);
    box-shadow: 0 0 0 1px var(--bs-border-color);
    line-height: 0; padding: 1px;
  }
  .deny-lock svg { display: block; }
  /* T24 拦截动效：行/卡片 shake 抖动 ~300ms（颜色走 --bs-* 变量，深色下自动适配） */
  @keyframes denyShake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-7px); }
    30% { transform: translateX(6px); }
    45% { transform: translateX(-4px); }
    60% { transform: translateX(3px); }
    75% { transform: translateX(-2px); }
  }
  .deny-shake { animation: denyShake .3s ease; }
  @media (prefers-reduced-motion: reduce) { .deny-shake { animation: none; } }
  /* 置顶列表行分隔 */
  .prow + .prow { border-top: 1px dashed var(--bs-border-color); }
  /* 星标 */
  .star { color: #d1d5db; font-size: 16px; transition: transform .15s ease, color .15s ease; }
  .star.on { color: #d97706; }
  @media (hover: hover) { .star:hover { transform: scale(1.15); } }
  /* 详情表 */
  .detail-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .detail-tbl td { padding: 6px 8px; border-bottom: 1px solid var(--bs-border-color); vertical-align: top; word-break: break-all; }
  .detail-tbl td.k { color: var(--bs-secondary-color); width: 84px; white-space: nowrap; }
  .detail-sec { margin-top: 14px; padding-bottom: 6px; border-bottom: 1px solid var(--bs-border-color);
                font-size: 13px; font-weight: 600; color: var(--bs-secondary-color); }
  /* Markdown 渲染 */
  .md-h { margin: 12px 0 6px; }
  .md-p { margin: 6px 0; }
  .md-code { background: var(--bs-tertiary-bg); border: 1px solid var(--bs-border-color); border-radius: 8px;
             padding: 10px; overflow: auto; font-size: 12px; line-height: 1.6; margin: 8px 0; }
  .md-quote { border-left: 3px solid var(--bs-primary); color: var(--bs-secondary-color); padding: 4px 10px;
              margin: 8px 0; background: var(--bs-primary-bg-subtle); border-radius: 0 6px 6px 0; }
  .md-hr { border: none; border-top: 1px solid var(--bs-border-color); margin: 12px 0; }
  .md-table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
  .md-table th, .md-table td { border: 1px solid var(--bs-border-color); padding: 5px 8px; text-align: left; }
  .md-table th { background: var(--bs-tertiary-bg); }
  .md-ul, .md-ol { margin: 6px 0 6px 22px; }
  /* 文本预览 */
  .text-pre { white-space: pre-wrap; font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 13px;
              line-height: 1.7; background: var(--bs-tertiary-bg); border: 1px solid var(--bs-border-color);
              border-radius: 8px; padding: 10px; overflow: auto; max-height: 60vh; }
  /* 预览加载态（可取消）：转圈 + 提示 + 取消按钮 */
  .ld-box { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  /* T38 P3-8：PDF 兜底提示块（边框+浅底+图标，醒目但不刺眼；深浅色走 --bs-* 变量） */
  .pdf-fallback {
    display: flex; align-items: center; gap: 8px;
    border: 1px dashed var(--bs-warning-border-subtle);
    background: var(--bs-warning-bg-subtle);
    color: var(--bs-warning-text-emphasis);
    border-radius: 8px; padding: 10px 14px; font-size: 13px;
  }
  .pdf-fallback .pdf-fb-ic { color: var(--bs-warning); display: inline-flex; }
  .pdf-fallback a { color: var(--bs-primary); font-weight: 600; text-underline-offset: 2px; }
  /* 大文本分片渲染进度提示 */
  .render-tip { color: var(--bs-secondary-color); font-size: 12px; margin: 6px 0; }
  /* 截断提示行（超大文件仅预览前 400KB 时的分割线 + 说明 + 下载全文按钮） */
  .bigfile-note { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px;
                  border-top: 1px solid var(--bs-border-color); color: var(--bs-secondary-color); font-size: 13px; }
  /* 解压列表 */
  .unpack-list { max-height: 50vh; overflow: auto; border: 1px solid var(--bs-border-color); border-radius: 8px; }
  .unpack-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--bs-border-color); }
  .unpack-row:last-child { border-bottom: none; }
  .unpack-row:not(.dir) { cursor: pointer; }
  @media (hover: hover) { .unpack-row:not(.dir):hover { background: var(--bs-tertiary-bg); } }
  .unpack-row .uname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .unpack-row .usz { color: var(--bs-secondary-color); font-size: 12px; flex-shrink: 0; }
  /* T25 压缩包层级浏览：目录行可点进入（▶）+ 面包屑 */
  .unpack-row.dir { cursor: pointer; }
  .unpack-row.dir .uname { color: var(--bs-body-color); font-weight: 500; }
  @media (hover: hover) { .unpack-row.dir:hover { background: var(--bs-primary-bg-subtle); } }
  .unpack-row .dir-arrow { color: var(--bs-secondary-color); flex-shrink: 0; display: inline-flex; align-items: center; }
  .unpack-crumb { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; font-size: 13px; }
  .unpack-crumb-seg { padding: 2px 8px; border-radius: 6px; cursor: pointer; color: var(--bs-secondary-color);
                      white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
  @media (hover: hover) { .unpack-crumb-seg:hover { background: var(--bs-tertiary-bg); color: var(--bs-body-color); } }
  .unpack-crumb-seg.cur { color: var(--bs-body-color); font-weight: 600; cursor: default; }
  @media (hover: hover) { .unpack-crumb-seg.cur:hover { background: none; } }
  .unpack-crumb-sep { color: var(--bs-border-color); }
  .unpack-up { flex-shrink: 0; }
  /* 视频容器 */
  .video-wrap { position: relative; width: 100%; max-height: 60vh; max-height: 60dvh; background: #000; border-radius: 8px; overflow: hidden; }
  .video-wrap video { width: 100%; max-height: 60vh; max-height: 60dvh; background: #000; display: block; }
  .video-err { display: none; color: var(--bs-danger); font-size: 13px; margin-top: 8px; line-height: 1.8; white-space: pre-wrap; }
  /* 转码等待提示（原生模式转码档 409 轮询期间显示） */
  .video-tip { display: none; text-align: center; color: var(--bs-secondary-color); font-size: 13px; padding: 6px 0; }
  /* 进度条预览浮层（缩略图条 / 单帧）——P0 #8：补深色底 + 白边，
     缩略图未就绪/加载中时不再以透明空框透出下层视频画面 */
  .video-preview { position: absolute; z-index: 5;
                   background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.6); border-radius: 6px;
                   overflow: hidden; pointer-events: none; }
  .video-preview img { display: block; height: 90px; opacity: 1; filter: brightness(1.1); transition: opacity .15s ease, filter .15s ease; }   /* 停止后清晰+提亮 1.1；滑动时 JS 置 0.4 无滤镜 */
  /* 画质/选项控制条（P0 #10）：统一 32px 高、对齐一致、画质标签不折行、复选框组 2×2 网格 */
  .video-ctrl { align-items: center; row-gap: 8px; column-gap: 16px; }
  .video-ctrl .qwrap { flex-shrink: 0; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .video-ctrl .form-select { min-height: 32px; width: auto; }
  .video-chks { display: inline-flex; flex-wrap: wrap; align-items: center; column-gap: 16px; row-gap: 8px; }
  .video-chks .form-check { min-height: 32px; display: inline-flex; align-items: center; gap: 6px; margin: 0; padding-left: 0; }
  .video-chks .form-check-input { accent-color: #2563eb; flex-shrink: 0; }
  /* 字幕覆盖层（MSE 模式用自定义 overlay 显示字幕） */
  .video-sub { position: absolute; left: 0; right: 0; bottom: 8%; text-align: center; z-index: 4;
               color: #fff; font-size: 15px; line-height: 1.5; text-shadow: 0 1px 3px #000;
               padding: 0 12px; pointer-events: none; white-space: pre-wrap; word-break: break-all; }
  /* 视频详情面板（标题/作者/类型/统计/标签/备注；识别到才展示） */
  .video-meta { padding-bottom: 2px; }
  .vtitle { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; word-break: break-all; }
  .vavatar { width: 28px; height: 28px; font-size: 13px; flex-shrink: 0; user-select: none; }
  .vname { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vtag { font-size: 12px; padding: .35em .7em; transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
  @media (hover: hover) { .vtag:hover { background: var(--bs-secondary-bg); border-color: var(--bs-secondary-border-subtle); } }
  .vtech { font-size: 11px; padding: .3em .6em; color: var(--bs-secondary-color);
           max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vnotes { line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
  .vnotes-fold { max-height: 4.8em; overflow: hidden; }
  .vtoggle { text-decoration: none; user-select: none; }
  /* ===== 播放页信息面板美化（视频网站风：作者行/资料行/统计行） ===== */
  .video-meta { max-width: 720px; }                    /* d) 面板放宽上限，避免信息压缩 */
  .vmeta-authors { row-gap: 6px; }
  .vtitle { font-size: 1.4rem; font-weight: 700; letter-spacing: .01em;
            color: var(--bs-emphasis-color); line-height: 1.25; }
  .vstudio-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; line-height: 1;
    color: var(--bs-body-color);
    background: color-mix(in srgb, var(--bs-primary) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--bs-primary) 45%, transparent);
    border-radius: 6px; padding: .32em .65em; flex-shrink: 0;
  }
  .vstudio-badge::before { content: "🎬"; font-size: 11px; }
  .vtype-badge { font-size: 11.5px; font-weight: 600; padding: .3em .6em; flex-shrink: 0; }
  .vdata-row { display: flex; flex-direction: column; gap: 7px; }
  .vdata-row .d-flex { flex-wrap: wrap; align-items: center; column-gap: 6px; row-gap: 6px; }
  .vdata-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12.5px; font-weight: 600; line-height: 1;
    color: var(--bs-body-color);
    background: var(--bs-tertiary-bg);
    border: 1px solid var(--bs-border-color);
    border-radius: 999px; padding: .4em .75em;
    font-variant-numeric: tabular-nums;               /* 数字（★9.4/1920x1080）等宽对齐，不突兀 */
    vertical-align: middle; align-self: center;        /* ②与同行徽章垂直居中 */
  }
  .vdata-chip.vrate .vrate-star { display: inline-block; line-height: 1; vertical-align: -1px; }
  .vdata-chip.vrate { color: #b8860b; border-color: color-mix(in srgb, #ffc107 55%, transparent);
                      background: color-mix(in srgb, #ffc107 14%, transparent); }
  .vdata-chip.vdata-sub { font-weight: 500; color: var(--bs-secondary-color); font-size: 12px; }
  .vdata-sec { margin-top: 8px; opacity: .95; padding-top: 7px; border-top: 1px dashed var(--bs-border-color); }
  .vstat {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; line-height: 1; color: var(--bs-secondary-color);
    background: var(--bs-tertiary-bg); border: 1px solid var(--bs-border-color);
    border-radius: 8px; padding: .44em .75em; white-space: nowrap;
  }
  .vstat-ic { font-size: 12px; flex-shrink: 0; width: 14px; text-align: center; }  /* ②统一图标列宽 */
  .vstat-label { color: var(--bs-secondary-color); opacity: .85; flex-shrink: 0; }
  .vstat-val { color: var(--bs-body-color); font-weight: 600;
               min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
               font-variant-numeric: tabular-nums; }
  .detail-sec-row td.k { font-size: 11px; letter-spacing: .05em; opacity: .6; padding-top: 10px; }
  /* ===== t8 布局优化附加规则 ===== */
  /* P2 窄屏统计行：胶囊可换行，值过长省略号（原 white-space:nowrap 在窄容器内会裁切） */
  .vstats { flex-wrap: wrap; column-gap: 8px; row-gap: 8px; }
  .vstat { max-width: 100%; white-space: nowrap; }
  .vstudio-hint {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; line-height: 1; color: var(--bs-secondary-color);
    background: var(--bs-tertiary-bg); border: 1px dashed var(--bs-border-color);
    border-radius: 5px; padding: .3em .55em; flex-shrink: 0;
  }
  /* P5 标签行：前缀 chip 与后面胶囊统一为 pill 视觉；固定统一 gap 消除间距不均 */
  .vtag-row { row-gap: 7px; column-gap: 7px; align-items: center; }
  .vtag { margin: 0; }
  .vtag-prefix {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11.5px; font-weight: 600; line-height: 1; color: var(--bs-secondary-color);
    background: var(--bs-tertiary-bg); border: 1px solid var(--bs-border-color);
    border-radius: 999px; padding: .38em .75em; flex-shrink: 0;
  }
  /* P3 技术信息折叠区：默认收起；与上方标签行用分割/留白分隔（b） */
  .vtech-details { user-select: none; margin-top: 14px; }
  .vtech-details::before { content: ""; display: block; height: 1px; background: var(--bs-border-color);
                           opacity: .5; margin-bottom: 10px; }   /* 分割线，避免与标签行粘连 */
  .vtech-details[open] .vtech-summary { opacity: .8; }
  .vtech-summary {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; color: var(--bs-secondary-color); cursor: pointer;
    background: var(--bs-tertiary-bg); border: 1px solid var(--bs-border-color);
    border-radius: 6px; padding: .34em .7em; list-style: none; width: fit-content;
  }
  .vtech-summary::-webkit-details-marker, .vtech-summary::marker { display: none; content: ""; }
  .vtech-summary::after { content: " ▾"; opacity: .7; }
  .vtech-details[open] .vtech-summary::after { content: " ▴"; }
  /* ②手机端行距/对齐打磨 */
  @media (max-width: 575.98px) {
    .video-meta { line-height: 1.5; }
    .vmeta-authors, .vdata-row, .vstats, .vtag-row { row-gap: 8px; }
  }
  /* P1 详情/预览弹窗高度管理：正文区 max-height + 内部滚动，避免底部内容被截断 */
  #appModal .modal-dialog { max-height: calc(100vh - 30px); }
  #appModal .modal-content { max-height: inherit; display: flex; flex-direction: column; }
  #appModal .modal-body { overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }   /* P0 #9：flex 列子项 min-height:0，内部滚动才不把 dialog 撑出视口 */
  .detail-tbl { width: 100%; table-layout: auto; }
  .detail-tbl td.k { white-space: nowrap; padding-right: 1.4em; vertical-align: top; }
  .detail-tbl td.v { word-break: break-word; overflow-wrap: anywhere; padding-right: 12px; }
  /* 备注原文折叠：长 comment 按语义换行而非硬截（根因2/3） */
  .detail-note-raw { font-size: 12px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
                     color: var(--bs-secondary-color); background: var(--bs-tertiary-bg);
                     border: 1px solid var(--bs-border-color); border-radius: 6px;
                     padding: 8px 10px; margin-top: 4px; }
  /* 底部按钮缓冲：避免弹窗底部按钮被遮挡（根因3） */
  #appModal .modal-body { padding-bottom: 18px; }
  @media (max-width: 575.98px) {
    #appModal .modal-body { padding-bottom: 26px; }
    .detail-tbl td.k { padding-right: 1em; }
    /* P0 #9：修手机弹窗底部 23px 条带漏底——modal-fullscreen-sm-down 应占满视口，
       不被上方 .modal-dialog max-height: calc(100vh-30px) 掐出底缝 */
    #appModal .modal-dialog { max-height: 100vh; max-height: 100dvh; }
    /* P0 #10：复选框组 2×2 网格、统一左缘，label 行高 44px、勾选框 22×22px */
    .video-chks { flex: 1 1 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px; row-gap: 6px; }
    .video-chks .form-check { min-height: 44px; display: flex; align-items: center; gap: 8px; margin: 0; }
    .video-chks .form-check-input { width: 22px; height: 22px; }
  }
  /* 网格视图（大图标，类似 Windows 文件管理器） */
  #fileRows.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; padding: 8px; }
  .grid-item { display: flex; flex-direction: column; align-items: center; padding: 10px 6px 8px; cursor: pointer; text-align: center;
               border-radius: 10px; transition: background-color .15s ease, box-shadow .15s ease; }
  @media (hover: hover) {
    .grid-item:hover { background: var(--bs-tertiary-bg); box-shadow: 0 4px 14px rgba(17,24,39,.10); }
  }
  .grid-top { width: 100%; display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-bottom: 2px; }
  .grid-star { color: #d1d5db; font-size: 14px; cursor: pointer; user-select: none; transition: transform .15s ease, color .15s ease; }
  @media (hover: hover) { .grid-star:hover { transform: scale(1.15); } }
  .grid-star.on { color: #d97706; }
  .grid-info { font-size: 14px; cursor: pointer; padding: 0 2px; }
  .grid-cover-wrap { width: 88px; height: 88px; display: flex; align-items: center; justify-content: center; }
  .grid-cover { max-width: 88px; max-height: 88px; object-fit: contain; }
  /* 视频封面：圆角 + cover 填满容器（消除方形 contain 的上下大空白） */
  .grid-cover.video-thumb { width: 88px; height: 88px; object-fit: cover; border-radius: 10px; }
  .grid-item:hover .grid-cover.video-thumb { border-radius: 10px; }
  .grid-name { width: 100%; font-size: 12px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; margin-top: 8px; }
  .grid-size { color: var(--bs-secondary-color); font-size: 11px; margin-top: 2px; }
  /* ===== 手机端（≤575.98px）：触控目标 ≥44px、字号提升、窄屏布局 ===== */
  @media (max-width: 575.98px) {
    body { font-size: 15px; }
    /* 主要交互按钮统一 ≥44px 触控高度（打包面板内部的密集小按钮除外，见下） */
    .btn-sm { padding: .4rem .75rem; font-size: .875rem; border-radius: .4rem; min-height: 44px; }
    .btn { min-height: 44px; }
    .pack-panel .btn { min-height: 36px; }          /* 面板内密集按钮（任务✕/▶/跳过）适度缩小 */
    .list-group-item { min-height: 44px; }
    .prow { min-height: 44px; }
    .vtitle { font-size: 1.05rem; }
    /* 行内图标触控点（星标/详情/分享）与面包屑分段：扩大命中区 */
    .star, .info-btn, .share-btn { display: inline-flex; align-items: center; justify-content: center;
                                   min-width: 40px; min-height: 44px; }
    #breadcrumb .seg, #breadcrumb .cur { display: inline-flex; align-items: center; min-height: 40px; }
    .type-chip, .tag-chip { min-height: 44px; }   /* 统一触控高度（审计 P2-4：40px < 44px） */
    /* 进度条预览浮层降高：竖屏手机上不再盖住原生控制条 */
    .video-preview img { height: 56px; opacity: 1; filter: brightness(1.1); transition: opacity .15s ease, filter .15s ease; }
    /* 置顶卡头部：窄屏改为两行堆叠（标题行可截断 + 操作按钮行），杜绝 320px 挤压溢出；
       flex-shrink-0 为 Bootstrap !important 工具类，须用 !important 覆盖 */
    #pinnedCard .card-header { flex-wrap: wrap; row-gap: 2px; }
    #pinnedHead { flex: 1 1 100% !important; }
    /* 网格视图：缩略图略缩 + 列数自适应（320px 可达 3 列，不再窄屏空荡） */
    .grid-cover-wrap { width: 76px; height: 76px; }
    .grid-cover { max-width: 76px; max-height: 76px; }
    .grid-cover.video-thumb { width: 76px; height: 76px; border-radius: 8px; }
    #fileRows.grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); }
    .grid-name { font-size: 13px; }
    .grid-size { font-size: 12px; }
  }
  /* 右侧滑出侧边栏（视图/类型筛选/排序/搜索） */
  .sidebar-mask { position: fixed; inset: 0; background: rgba(17,24,39,.45); z-index: 1040;
                  opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  .sidebar-mask.show { opacity: 1; pointer-events: auto; }
  .sidebar { position: fixed; top: 0; right: 0; bottom: 0; z-index: 1041; width: min(320px, 86vw);
             background: var(--brand-surface); display: flex; flex-direction: column; transform: translateX(102%);
             transition: transform .28s ease; }
  .sidebar.show { transform: translateX(0); }
  .sidebar-head { padding: 14px 16px; border-bottom: 1px solid var(--bs-border-color); }
  .sidebar-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
  .sidebar-foot { flex-shrink: 0; padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
  .sidebar-body { overscroll-behavior: contain; }
  .type-chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--bs-border-color);
               border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; user-select: none;
               background: var(--brand-surface); transition: all .15s ease; }
  .type-chip input { margin: 0; cursor: pointer; }
  .type-chip.active { background: var(--bs-primary); border-color: var(--bs-primary); color: #fff; }
  /* 推荐标签 chips（点击→追加到搜索框，pulse 为点击反馈动画） */
  .tag-chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--bs-border-color);
              border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12px; user-select: none;
              background: var(--brand-surface); transition: all .15s ease; }
  @media (hover: hover) { .tag-chip:hover { background: var(--bs-primary); border-color: var(--bs-primary); color: #fff; } }
  .tag-chip .score { font-size: 10px; opacity: .55; }
  .tag-chip.pulse { animation: tagPulse .25s ease; }
  @keyframes tagPulse { 0% { transform: scale(1); } 50% { transform: scale(1.18); } 100% { transform: scale(1); } }
  /* 置顶列表折叠态（头部点击切换） */
  .pinned-fold { display: none; }
  /* ===== 打包中心面板（右下角悬浮，不遮罩不锁滚动） =====
     bottom 用 max(12px, env(safe-area-inset-bottom))：iOS 刘海屏/全面屏手势条互不遮挡 */
  .pack-panel { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
                width: min(560px, calc(100vw - 24px));
                max-height: min(78vh, 720px); max-height: min(78dvh, 720px);
                display: flex; flex-direction: column; background: var(--brand-surface);
                border: 1px solid var(--bs-border-color); border-radius: 12px; z-index: 1030;
                box-shadow: 0 12px 44px rgba(17,24,39,.22); overflow: hidden; }
  .pack-panel.mini { transform: translateY(calc(100% - 46px)); transition: transform .18s ease; }
  #packPanelHead { cursor: pointer; border-bottom: 1px solid var(--bs-border-color); user-select: none; }
  /* 头部各元素：进度条可压缩、完成芯片超长截断，避免 320px 挤压 */
  .pack-total-wrap { min-width: 0; }
  #packDone { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pack-total-wrap { height: 6px; border-radius: 3px; }
  #packTasks { max-height: 42vh; max-height: 42dvh; overflow-y: auto; }
  .pack-empty { text-align: center; color: var(--bs-secondary-color); font-size: 13px; padding: 18px 0; }
  .pk-task { border: 1px solid var(--bs-border-color) !important; border-radius: 8px !important;
             padding: 8px 10px !important; }
  .pk-nm { min-width: 0; }
  .pk-skiplist { max-height: 130px; overflow-y: auto; border-top: 1px dashed var(--bs-border-color);
                 padding-top: 4px; word-break: break-all; }
  .pk-prow { border-bottom: 1px dashed var(--bs-border-color); padding: 2px 0; }
  .pk-prow:last-child { border-bottom: none; }
  .pk-dir-btn { cursor: pointer; }
  /* 排队/扫描不确定态：轨道条纹动画进度条 */
  .progress.pk-idle-track { background: repeating-linear-gradient(45deg, var(--bs-secondary-bg) 0 6px, var(--bs-tertiary-bg) 6px 12px);
                             animation: pkIdle 1s linear infinite; }
  @keyframes pkIdle { to { background-position: 24px 0; } }
  /* 头部活动摘要（打包中/下载中/待下载/扫描排队），窄屏隐藏腾位置 */
  @media (max-width: 575.98px) { #packSummary { display: none !important; } }
  #packMiniBar { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
                 z-index: 1060; padding: 8px 14px;
                 background: rgba(17,24,39,.92); color: #fff; border-radius: 999px; font-size: 13px;
                 cursor: pointer; box-shadow: 0 6px 18px rgba(17,24,39,.25); }
  @media (max-width: 575.98px) {
    /* 打包中心 = 从底部滑出的全宽 bottom sheet：贴合底部、max-height 控制、内部滚动 */
    .pack-panel { left: 0; right: 0; bottom: 0; width: 100%; border-radius: 14px 14px 0 0;
                  max-height: 85vh; max-height: 85dvh; padding-bottom: env(safe-area-inset-bottom); }
    #packMiniBar { right: 50%; transform: translateX(50%); }
    #packTasks { max-height: 46vh; max-height: 46dvh; }
    /* 提交区：模式按钮组整行并排、占满宽度；提交按钮独立一行放右（拇指可达） */
    #packModeGroup { width: 100%; }
    #packModeGroup .btn { flex: 1 1 0; min-width: 0; }
    #packNewTask .d-flex.align-items-center { align-items: stretch; }
    /* 矮屏（横屏手机等）压缩任务区高度，保证提交区不被裁 */
    @media (max-height: 640px) { #packTasks { max-height: 28vh; } }
    /* 全屏弹窗底部预留 iOS 手势条区域 */
    .modal-content { padding-bottom: env(safe-area-inset-bottom); }
  }

  /* ==================== T7 视觉大升级：肉眼可见的现代感与品牌感 ==================== */
  :root {
    --brand-grad-from: #2563eb;   /* 品牌渐变起点（导航 / 主按钮 / 活动胶囊）- 深一档保证白字对比 */
    --brand-grad-to: #1d4ed8;     /* 品牌渐变终点 - 更深蓝 */
    --brand-card-shadow: 0 4px 16px rgba(15, 23, 42, .08), 0 1px 3px rgba(15, 23, 42, .06);   /* 卡片浮起阴影（双层更立体） */
    --brand-card-border: 1px solid var(--bs-border-color);   /* 卡片清晰描边，消除虚感 */
    --brand-card-radius: 16px;    /* 卡片大圆角 */
    --brand-btn-radius: 10px;     /* 按钮圆角 */

  <!-- 工具栏：导航（后退/前进）+ 面包屑（横向滚动）+ 刷新/视图切换（窄屏图标化腾出面包屑宽度） -->
  <div class="d-flex align-items-center gap-2 mb-2">
    <button id="navBack" class="nav-icon-btn flex-shrink-0" title="后退" aria-label="后退" disabled><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <button id="navFwd" class="nav-icon-btn flex-shrink-0" title="前进" aria-label="前进" disabled><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
    <div id="breadcrumb" class="d-flex align-items-center overflow-x-auto text-nowrap flex-grow-1 py-1"></div>
    <button id="refreshBtn" class="btn btn-outline-secondary btn-sm flex-shrink-0" aria-label="刷新"><span class="d-none d-sm-inline"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg> 刷新</span><span class="d-inline d-sm-none"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span></button>
    <button id="viewBtn" class="btn btn-outline-secondary btn-sm flex-shrink-0" title="视图与筛选" aria-label="视图与筛选"><span class="d-none d-sm-inline"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg> 筛选</span><span class="d-inline d-sm-none"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></span></button>
  </div>

  <div id="alert" class="alert alert-danger py-2 mb-2 d-none"></div>

  <!-- 上传进度条 -->
  <div class="progress d-none mb-2" style="height:4px" role="progressbar" aria-label="上传进度">
    <div id="upBar" class="progress-bar" style="width:0%"></div>
  </div>

  <!-- 文件列表（list-group） -->
  <div class="card shadow-sm">
    <!-- 批量操作栏（长按进入多选模式后显示） -->
    <div id="bulkBar" class="bulk-bar d-none">
      <div class="d-flex flex-wrap align-items-center gap-2 px-3 py-2 border-bottom">
        <span class="fw-semibold small flex-shrink-0" id="bulkCount">已选 0 项</span>
        <button type="button" id="bulkSelectAll" class="btn btn-sm btn-outline-primary flex-shrink-0">全选</button>
        <button type="button" id="bulkPin" class="btn btn-sm btn-outline-primary flex-shrink-0" title="收藏选中的文件"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg> 收藏</button>
        <button type="button" id="bulkUnpin" class="btn btn-sm btn-outline-warning flex-shrink-0" title="取消收藏"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> 取消收藏</button>
        <button type="button" id="bulkShare" class="btn btn-sm btn-outline-primary flex-shrink-0" title="批量生成分享链接"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> 分享</button>
        <button type="button" id="bulkDownload" class="btn btn-sm btn-outline-primary flex-shrink-0" title="下载选中的文件"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 4v12"/><path d="M8 12l4 4 4-4"/><path d="M4 20h16"/></svg> 下载</button>
        <button type="button" id="bulkPack" class="btn btn-sm btn-primary flex-shrink-0" title="打包选中的文件"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> 打包</button>
        <span class="flex-grow-1"></span>
        <button type="button" id="bulkCancel" class="btn btn-sm btn-outline-secondary flex-shrink-0" title="退出多选"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> 取消</button>
      </div>
    </div>
    <div id="listStats" class="list-stats d-none"></div>
    <div id="fuzzyHint" class="render-tip d-none" style="padding:6px 14px 0"></div>
    <ul id="fileRows" class="list-group list-group-flush"></ul>
  </div>
</main>

<!-- 打包中心（后台任务面板：排队/进度/下载，右下角悬浮） -->
<div id="packPanel" class="pack-panel d-none" aria-label="打包中心">
  <div class="pack-head d-flex align-items-center gap-2 px-3 py-2" id="packPanelHead">
    <span class="fw-semibold flex-shrink-0">📦 打包中心</span>
    <span id="packDone" class="badge text-bg-primary flex-shrink-0 d-none text-nowrap">任务完成 0/0</span>
    <div class="progress flex-grow-1 pack-total-wrap"><div id="packTotalBar" class="progress-bar" style="width:0%"></div></div>
    <span id="packSummary" class="small text-muted flex-shrink-0 d-none text-nowrap"></span>
    <button id="packPanelClose" class="btn-close flex-shrink-0" aria-label="关闭"></button>
  </div>
  <div id="packTasks" class="overflow-auto px-3 py-2"></div>
  <div id="packNewTask" class="border-top px-3 py-2">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
      <span class="small fw-semibold flex-grow-1" id="packNewLabel">将打包收藏的 0 项</span>   <!-- T36：置顶→收藏 文案统一 -->
      <div class="btn-group btn-group-sm" id="packModeGroup">
        <button type="button" class="btn btn-outline-primary btn-sm px-2" data-amode="store" title="不压缩，最快">⚡不压缩</button>
        <button type="button" class="btn btn-outline-primary btn-sm px-2" data-amode="fast" title="低压缩，快">🚀快</button>
        <button type="button" class="btn btn-outline-primary btn-sm px-2 active" data-amode="normal" title="标准压缩">📦标准</button>
      </div>
      <button id="packSubmitBtn" class="btn btn-primary btn-sm">＋ 提交打包</button>
    </div>
    <div class="small text-muted mb-1">提示：压缩级别越高包越小但耗时越长；不压缩仅打包不做数据压缩，速度最快。</div>
    <div id="packPreviewTree"></div>
  </div>
</div>

<!-- 打包中心迷你条（面板折叠时右下角提示） -->
<div id="packMiniBar" class="d-none"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> 打包中心</div>

<!-- 收藏悬浮球（FAB）：常驻右下角，有收藏时显示数量徽标；分享模式隐藏 -->
<div id="pinFab" class="pin-fab d-none" role="button" tabindex="0" title="收藏" aria-label="打开收藏列表">
  <span class="pin-fab-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg></span>
  <span id="pinFabBadge" class="pin-fab-badge d-none">0</span>
</div>

<!-- 收藏面板（点击悬浮球弹出：列表 + 底部操作，样式参考预览卡片） -->
<div id="pinPanel" class="pin-panel" role="dialog" aria-label="收藏列表">
  <div class="pin-panel-head">
    <span class="fs-6 fw-semibold" id="pinPanelTitle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;color:var(--brand-accent,#f59e0b)"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg> 收藏 · 0 项</span>
    <span class="flex-grow-1"></span>
    <button type="button" id="pinShareAllBtn" class="btn btn-outline-primary btn-sm flex-shrink-0" title="全部收藏生成分享链接"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> 全部分享</button>
    <button type="button" id="pinPackBtn" class="btn btn-outline-primary btn-sm flex-shrink-0" title="打开打包中心"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> 打包</button>
    <button type="button" id="pinClearBtn" class="btn btn-link btn-sm text-danger text-nowrap p-0 d-none" title="清空全部收藏">全部清空</button>
    <button type="button" class="btn-close ms-1" id="pinPanelClose" aria-label="关闭"></button>
  </div>
  <div id="pinPanelBody" class="pin-panel-body"></div>
</div>

<!-- 轻量 toast -->
<div id="toast" class="app-toast" role="status" aria-live="polite"></div>

<!-- 通用弹窗（Bootstrap Modal：手机全屏，桌面居中） -->
<div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h5 class="modal-title text-truncate fs-6" id="appModalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body" id="appModalBody"></div>
    </div>
  </div>
</div>

<!-- 右侧滑出侧边栏：视图切换 / 类型筛选 / 排序 / 搜索 -->
<div id="sidebarMask" class="sidebar-mask"></div>
<aside id="sidebar" class="sidebar" aria-label="视图与筛选">
  <div class="sidebar-head d-flex align-items-center justify-content-between">
    <span class="fs-6 fw-semibold">▦ 视图与筛选</span>
    <button type="button" class="btn-close" id="sidebarClose" aria-label="关闭"></button>
  </div>
  <div class="sidebar-body">
    <div class="mb-3">
      <label class="form-label small fw-semibold mb-1" for="searchInput">搜索</label>
      <div class="d-flex align-items-center gap-2">
        <input type="search" id="searchInput" class="form-control form-control-sm" placeholder="按文件名搜索…" autocomplete="off">
        <label class="form-check form-switch mb-0 flex-shrink-0" style="font-size:13px" title="勾选后同时匹配文件名与元数据内容（标题/作者/标签/备注等）">
          <input type="checkbox" id="searchMetaToggle" class="form-check-input" role="switch">
          <span class="form-check-label">深度查找</span>
        </label>
      </div>
    </div>
    <div class="mb-3">
      <div class="d-flex align-items-center justify-content-between mb-1">
        <label class="form-label small fw-semibold mb-0">推荐标签</label>
        <button type="button" id="tagRefresh" class="btn btn-link btn-sm p-0 text-decoration-none" title="重新扫描当前目录"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
      </div>
      <div id="tagSuggest" class="d-flex flex-wrap gap-1"></div>
      <div class="text-muted small mt-1" style="opacity:.8">点击标签快速搜索 · 标签来自当前目录文件名与元数据</div>
      <div id="tagHint" class="text-muted small mt-1"></div>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold mb-1">视图</label>
      <div class="btn-group w-100" role="group" aria-label="视图切换">
        <button type="button" id="viewListBtn" class="btn btn-sm btn-outline-primary"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg> 列表</button>
        <button type="button" id="viewGridBtn" class="btn btn-sm btn-outline-primary"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> 网格</button>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold mb-1">图标风格</label>
      <div class="btn-group w-100" role="group" aria-label="图标风格切换">
        <button type="button" id="iconLineBtn" class="btn btn-sm btn-outline-primary">线条</button>
        <button type="button" id="iconColorBtn" class="btn btn-sm btn-outline-primary">彩色</button>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold mb-1">显示隐藏文件</label>
      <label class="form-check form-switch mb-0 d-flex align-items-center justify-content-between" title="显示以 . 或 ~ 开头、以及带隐藏属性的文件">
        <span class="small text-muted">列出隐藏文件（. / ~ 开头、隐藏属性）</span>
        <input type="checkbox" id="showHiddenToggle" class="form-check-input" role="switch">
      </label>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold mb-1">类型筛选（多选）</label>
      <div class="d-flex flex-wrap gap-1 mb-2" id="typeFilters">
        <label class="type-chip"><input type="checkbox" data-type="video"> 视频</label>
        <label class="type-chip"><input type="checkbox" data-type="audio"> 音乐</label>
        <label class="type-chip"><input type="checkbox" data-type="text"> 文本</label>
        <label class="type-chip"><input type="checkbox" data-type="code"> 编程</label>
        <label class="type-chip"><input type="checkbox" data-type="exe"> 软件包</label>
        <label class="type-chip"><input type="checkbox" data-type="archive"> 压缩包</label>
        <label class="type-chip"><input type="checkbox" data-type="lnk"> 快捷方式</label>
        <label class="type-chip"><input type="checkbox" data-type="dir"> 目录</label>
      </div>
      <input type="text" id="extInput" class="form-control form-control-sm" placeholder="自输入后缀，如 md,txt,json" autocomplete="off">
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold mb-1" for="sortSelect">排序</label>
      <div class="d-flex align-items-center gap-1">
        <select id="sortSelect" class="form-select form-select-sm flex-grow-1">
          <option value="mtime">修改时间（新 → 旧）</option>
          <option value="name">名称（本地化）</option>
          <option value="size">大小（大 → 小）</option>
        </select>
        <button type="button" id="sortDirBtn" class="btn btn-outline-secondary btn-sm px-2 flex-shrink-0" title="切换排序方向">⇅</button>
      </div>
    </div>
  </div>
  <div class="sidebar-foot p-3 border-top">
    <button type="button" id="resetFilterBtn" class="btn btn-outline-secondary btn-sm w-100">重置筛选与排序</button>
  </div>
</aside>

<script src="static/bootstrap.bundle.min.js"></script>
<script src="static/highlight.min.js"></script>
<script src="static/cjk-normalize.js"></script>
<script src="static/app.js"></script>
</body>
</html>
